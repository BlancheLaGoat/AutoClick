plugins {
    id 'com.android.application'
}

android {
    namespace 'fr.blanche.autoclick'
    compileSdk 35

    defaultConfig {
        applicationId 'fr.blanche.autoclick'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '1.3'
    }

    // Clé de signature fixe, incluse dans le repo : chaque APK compilé a la même
    // signature, donc tu peux installer les mises à jour par-dessus sans désinstaller.
    signingConfigs {
        release {
            storeFile file('autoclick.keystore')
            storePassword 'autoclick'
            keyAlias 'autoclick'
            keyPassword 'autoclick'
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
